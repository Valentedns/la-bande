{% extends "base.html" %}
{% block title %}Créer un compte · La Bande{% endblock %}

{% block content %}
<h1>Créer un compte</h1>

<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="username">Pseudo</label>
  <input type="text" id="username" name="username" value="{{ form.username }}"
         required minlength="3" maxlength="30" autocomplete="username">

  <label for="email">Adresse e-mail</label>
  <input type="email" id="email" name="email" value="{{ form.email }}"
         required maxlength="254" autocomplete="email">

  <label for="password">Mot de passe (8 caractères minimum)</label>
  <input type="password" id="password" name="password"
         required minlength="8" maxlength="128" autocomplete="new-password">

  <label for="password_confirm">Confirmer le mot de passe</label>
  <input type="password" id="password_confirm" name="password_confirm"
         required minlength="8" maxlength="128" autocomplete="new-password">

  <button type="submit" class="button">Créer mon compte</button>
</form>

<p>Déjà un compte ? <a href="{{ url_for('auth.login') }}">Se connecter</a></p>
{% endblock %}
